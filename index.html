<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ibon 客群分析 Dashboard</title>
  <meta name="description" content="ibon 客群分析操作平台，支援地區、時間篩選，提供性別、年齡、情緒與行為圖表分析。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base:    #0B0F1A;
      --bg-surface: #131929;
      --bg-card:    #1A2238;
      --bg-card2:   #1E2940;
      --border:     rgba(99,130,255,0.15);
      --accent:     #6382FF;
      --accent2:    #38BEFF;
      --accent3:    #A78BFA;
      --text-pri:   #E8EDFB;
      --text-sec:   #8B9DC5;
      --text-muted: #526080;
      --success:    #34D399;
      --warn:       #FBBF24;
      --danger:     #F87171;
      --glow:       0 0 24px rgba(99,130,255,0.25);
      --radius:     14px;
      --radius-sm:  8px;
      --transition: 200ms ease;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-base);
      color: var(--text-pri);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background effect ── */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -15%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99,130,255,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(56,190,255,0.09) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Navbar ── */
    nav {
      position: sticky;
      top: 12px;
      left: 0; right: 0;
      margin: 12px 20px 0;
      background: rgba(19,25,41,0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }
    .nav-brand svg { color: var(--accent); }
    .nav-badge {
      font-size: 0.68rem;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(99,130,255,0.15);
      color: var(--accent);
      border: 1px solid rgba(99,130,255,0.3);
      padding: 2px 8px;
      border-radius: 20px;
    }
    .api-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-sec);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background var(--transition);
    }
    .status-dot.ok { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-dot.err { background: var(--danger); }

    /* ── Main layout ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    /* ── Config panel ── */
    .config-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }
    .config-panel h2 {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }
    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      align-items: end;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-sec);
    }
    input, select {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-pri);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      padding: 9px 12px;
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
      width: 100%;
    }
    input::placeholder { color: var(--text-muted); }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,130,255,0.18);
    }
    select option { background: var(--bg-card); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #4f6bef);
      color: #fff;
      box-shadow: var(--glow);
    }
    .btn-primary:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary {
      background: transparent;
      color: var(--text-sec);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--bg-card2); color: var(--text-pri); }

    /* ── Alert / Status bar ── */
    #statusBar {
      margin-bottom: 20px;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 0.84rem;
      display: none;
      align-items: center;
      gap: 10px;
    }
    #statusBar.info { display: flex; background: rgba(99,130,255,0.12); border: 1px solid rgba(99,130,255,0.3); color: var(--accent2); }
    #statusBar.success { display: flex; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); color: var(--success); }
    #statusBar.error { display: flex; background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--danger); }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: border-color var(--transition), transform var(--transition);
      cursor: default;
    }
    .stat-card:hover { border-color: rgba(99,130,255,0.4); transform: translateY(-2px); }
    .stat-label {
      font-size: 0.74rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      background: linear-gradient(135deg, var(--text-pri), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Charts grid ── */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }

    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      transition: border-color var(--transition);
    }
    .chart-card:hover { border-color: rgba(99,130,255,0.35); }
    .chart-card.wide { grid-column: 1 / -1; }
    .chart-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-sec);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .chart-wrap { position: relative; height: 260px; }
    .chart-wrap.tall { height: 320px; }

    /* ── Table ── */
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 24px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    thead th {
      text-align: left;
      padding: 10px 14px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      border-bottom: 1px solid var(--border);
    }
    tbody tr {
      border-bottom: 1px solid rgba(99,130,255,0.06);
      transition: background var(--transition);
      cursor: default;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(99,130,255,0.07); }
    tbody td { padding: 10px 14px; color: var(--text-pri); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state svg { margin: 0 auto 16px; display: block; opacity: 0.4; }
    .empty-state h3 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; color: var(--text-sec); }
    .empty-state p { font-size: 0.84rem; }

    /* ── Loading spinner ── */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Skeleton ── */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-card2) 25%, rgba(99,130,255,0.08) 50%, var(--bg-card2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    @media (max-width: 600px) {
      nav { margin: 8px 10px 0; padding: 12px 16px; }
      main { padding: 18px 10px 40px; }
      .config-grid { grid-template-columns: 1fr; }
    }

    /* ── Emotion badge ── */
    .emo-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 0.73rem;
      font-weight: 600;
    }
    .emo-happy  { background: rgba(52,211,153,0.15); color: var(--success); }
    .emo-neutral { background: rgba(99,130,255,0.12); color: var(--accent); }
    .emo-sad    { background: rgba(167,139,250,0.15); color: var(--accent3); }
    .emo-angry  { background: rgba(248,113,113,0.15); color: var(--danger); }
    .emo-fear   { background: rgba(251,191,36,0.15); color: var(--warn); }
    .emo-other  { background: rgba(139,157,197,0.15); color: var(--text-sec); }
  </style>
</head>
<body>

<!-- ──────────── NAVBAR ──────────── -->
<nav role="navigation" aria-label="主導覽列">
  <div class="nav-brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="3" width="20" height="14" rx="2"/>
      <path d="M8 21h8M12 17v4"/>
      <path d="M7 10h2l2 4 2-7 2 4h2"/>
    </svg>
    <span>ibon 客群分析</span>
    <span class="nav-badge">Dashboard</span>
  </div>
  <div class="api-status" aria-live="polite">
    <span class="status-dot" id="statusDot" aria-hidden="true"></span>
    <span id="statusText">未連線</span>
  </div>
</nav>

<!-- ──────────── MAIN ──────────── -->
<main>

  <!-- Config panel -->
  <div class="config-panel" role="region" aria-label="查詢設定">
    <h2>查詢設定</h2>
    <div class="config-grid">
      <div class="form-group">
        <label for="apiHost">API Host (IP)</label>
        <input id="apiHost" type="text" placeholder="127.0.0.1" value="127.0.0.1" aria-required="true" />
      </div>
      <div class="form-group">
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" placeholder="輸入 X-API-Key" value="siang_20260309" />
      </div>
      <div class="form-group">
        <label for="dateStart">起始日期</label>
        <input id="dateStart" type="date" value="2026-03-01" />
      </div>
      <div class="form-group">
        <label for="dateEnd">結束日期</label>
        <input id="dateEnd" type="date" value="2026-03-31" />
      </div>
      <div class="form-group">
        <label for="districtFilter">地區篩選</label>
        <input id="districtFilter" type="text" placeholder="例：大同、內湖（留空=全部）" />
      </div>
      <div class="form-group" style="justify-content:flex-end; flex-direction:row; gap:8px; align-items:flex-end;">
        <button class="btn btn-secondary" id="btnVerify" onclick="verifyAPI()" aria-label="驗證 API 連線">驗證 API</button>
        <button class="btn btn-primary" id="btnQuery" onclick="runQuery()" aria-label="執行查詢分析">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          開始分析
        </button>
      </div>
    </div>
  </div>

  <!-- Status bar -->
  <div id="statusBar" role="alert" aria-live="assertive"></div>

  <!-- Stats row -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="stat-label">交易筆數</div>
      <div class="stat-value" id="statTotal">—</div>
      <div class="stat-sub">篩選後資料</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">大同門市數</div>
      <div class="stat-value" id="statStores">—</div>
      <div class="stat-sub">關聯門市</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">最常情緒</div>
      <div class="stat-value" id="statTopEmo" style="font-size:1.3rem">—</div>
      <div class="stat-sub" id="statTopEmoSub">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">TOP 功能</div>
      <div class="stat-value" id="statTopFunc" style="font-size:1rem">—</div>
      <div class="stat-sub" id="statTopFuncSub">—</div>
    </div>
  </div>

  <!-- Charts grid -->
  <div class="charts-grid" id="chartsSection" aria-label="圖表區域">
    <div class="chart-card">
      <div class="chart-title"><span class="dot"></span>情緒分佈</div>
      <div class="chart-wrap"><canvas id="chartEmotions" aria-label="情緒分佈圓餅圖"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title"><span class="dot" style="background:var(--accent2)"></span>性別分佈</div>
      <div class="chart-wrap"><canvas id="chartGender" aria-label="性別分佈環形圖"></canvas></div>
    </div>
    <div class="chart-card wide">
      <div class="chart-title"><span class="dot" style="background:var(--accent3)"></span>年齡區間 × 性別</div>
      <div class="chart-wrap tall"><canvas id="chartAge" aria-label="年齡與性別分組長條圖"></canvas></div>
    </div>
    <div class="chart-card wide">
      <div class="chart-title"><span class="dot" style="background:var(--success)"></span>首頁按鈕使用次數 Top 10</div>
      <div class="chart-wrap"><canvas id="chartButtons" aria-label="首頁按鈕使用次數橫條圖"></canvas></div>
    </div>
  </div>

  <!-- Top 行為明細 table -->
  <div class="table-card" role="region" aria-label="情緒明細表格">
    <div class="chart-title" style="margin-bottom:14px"><span class="dot" style="background:var(--warn)"></span>情緒明細統計</div>
    <div id="emoTableWrap">
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2zm0 0V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v10m-6 0a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/>
        </svg>
        <h3>尚無資料</h3>
        <p>請設定查詢條件後按「開始分析」</p>
      </div>
    </div>
  </div>

</main>

<script>
/* ═══════════════════════════════════════════════
   Chart instances (for destroy/re-create)
═══════════════════════════════════════════════ */
let charts = {};
const CHART_COLORS = {
  emotions: {
    happy:    '#34D399',
    neutral:  '#6382FF',
    sad:      '#A78BFA',
    angry:    '#F87171',
    fear:     '#FBBF24',
    surprise: '#38BEFF',
    disgust:  '#F472B6',
    '':       '#526080',
  }
};

/* ─── show status bar ─── */
function showStatus(msg, type = 'info') {
  const bar = document.getElementById('statusBar');
  bar.className = type;
  bar.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    ${type === 'error'
      ? '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>'
      : type === 'success'
        ? '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>'
        : '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>'}
  </svg><span>${msg}</span>`;
}

/* ─── nav status dot ─── */
function setDot(state) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-dot ' + state;
  txt.textContent = state === 'ok' ? 'API 已連線' : state === 'err' ? '連線失敗' : '未連線';
}

/* ─── API base URL ─── */
function base() {
  return `http://${document.getElementById('apiHost').value.trim()}:9846`;
}
function headers() {
  return { 'X-API-Key': document.getElementById('apiKey').value.trim() };
}

/* ─── Verify API ─── */
async function verifyAPI() {
  const btn = document.getElementById('btnVerify');
  btn.disabled = true;
  btn.textContent = '驗證中…';
  showStatus('正在驗證 API…', 'info');
  try {
    const res = await fetch(`${base()}/openapi.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const title   = json?.info?.title ?? '';
    const version = json?.info?.version ?? '';
    if (title !== 'ibon Data Access API for AI') throw new Error(`Title 不符: ${title}`);
    if (!version.startsWith('1.0312.')) throw new Error(`版本不符: ${version}`);
    setDot('ok');
    showStatus(`✓ API 驗證通過！版本 ${version}`, 'success');
  } catch(e) {
    setDot('err');
    showStatus('API 驗證失敗：' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '驗證 API';
  }
}

/* ─── Fetch all stores with pagination ─── */
async function fetchAllStores() {
  let stores = [], skip = 0, limit = 5000;
  while (true) {
    const url = `${base()}/api/v1/StoreDesc?limit=${limit}&skip=${skip}`;
    const res = await fetch(url, { headers: headers() });
    if (!res.ok) throw new Error('StoreDesc 請求失敗');
    const batch = (await res.json())?.data ?? [];
    if (!batch.length) break;
    stores.push(...batch);
    skip += limit;
  }
  return stores;
}

/* ─── Fetch user info filtered by date ─── */
async function fetchUserInfo(start, end) {
  const url = `${base()}/api/v1/ibonUserInfo?limit=10000&LogTime_start=${start}&LogTime_end=${end}`;
  const res = await fetch(url, { headers: headers() });
  if (!res.ok) throw new Error('ibonUserInfo 請求失敗');
  return (await res.json())?.data ?? [];
}

/* ─── Run full query pipeline ─── */
async function runQuery() {
  const btn = document.getElementById('btnQuery');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 分析中…';

  setDot('ok');
  showStatus('正在取得門市資料…', 'info');

  try {
    // 1. date params
    const dateS = document.getElementById('dateStart').value.replace(/-/g,'') + '000000';
    const dateE = document.getElementById('dateEnd').value.replace(/-/g,'') + '235959';
    const districtKw = document.getElementById('districtFilter').value.trim();

    // 2. verify first
    const verRes = await fetch(`${base()}/openapi.json`);
    if (!verRes.ok) throw new Error('無法連線 API，請確認 Host 與 Key');
    const verJson = await verRes.json();
    if (verJson?.info?.title !== 'ibon Data Access API for AI') throw new Error('API Title 不符，請確認版本');

    // 3. fetch stores
    showStatus('正在取得門市資料…', 'info');
    const stores = await fetchAllStores();

    // 4. fetch user info
    showStatus(`正在取得 ${dateS.slice(0,8)} ~ ${dateE.slice(0,8)} 的交易資料…`, 'info');
    const users = await fetchUserInfo(dateS, dateE);

    // 5. join
    const storeMap = {};
    stores.forEach(s => {
      const id = (s.Store_id ?? '').toString().trim();
      storeMap[id] = (s.Address ?? '').toString().trim();
    });

    let merged = users.map(u => ({
      ...u,
      Address: storeMap[(u.StoreID ?? '').toString().trim()] ?? ''
    }));

    // 6. district filter
    if (districtKw) {
      merged = merged.filter(r => r.Address.includes(districtKw));
    }

    // 7. render
    renderDashboard(merged, districtKw, stores.length);
    showStatus(`分析完成：共 ${merged.length} 筆交易${districtKw ? `（${districtKw}區篩選）` : ''}`, 'success');

  } catch(e) {
    setDot('err');
    showStatus('查詢失敗：' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> 開始分析`;
  }
}

/* ─── Render dashboard ─── */
function renderDashboard(data, district, totalStores) {
  // 統計
  const storeSet = new Set(data.map(r => r.StoreID));
  const emoCount = {};
  const genderCount = { M:0, F:0, Unknown:0 };
  const ageGender = {};
  const btnCount = {};

  data.forEach(r => {
    // emotions
    const emo = (r.Emotions ?? '').trim().toLowerCase();
    emoCount[emo] = (emoCount[emo] ?? 0) + 1;
    // gender
    const g = (r.Gender ?? '').toString().trim();
    if (g === '1' || g.toLowerCase() === 'm' || g.toLowerCase() === 'male') genderCount.M++;
    else if (g === '0' || g.toLowerCase() === 'f' || g.toLowerCase() === 'female') genderCount.F++;
    else genderCount.Unknown++;
    // age
    const age = (r.AGE ?? '').toString().trim();
    if (age) {
      if (!ageGender[age]) ageGender[age] = {M:0,F:0,Unknown:0};
      if (g === '1' || g.toLowerCase() === 'm') ageGender[age].M++;
      else if (g === '0' || g.toLowerCase() === 'f') ageGender[age].F++;
      else ageGender[age].Unknown++;
    }
    // buttons
    const btn = (r.LevelName_2 ?? '').trim();
    if (btn) btnCount[btn] = (btnCount[btn] ?? 0) + 1;
  });

  // stats
  document.getElementById('statTotal').textContent = data.length.toLocaleString();
  document.getElementById('statStores').textContent = storeSet.size;

  const topEmo = Object.entries(emoCount).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('statTopEmo').textContent = topEmo ? topEmo[0] || '(未知)' : '—';
  document.getElementById('statTopEmoSub').textContent = topEmo ? `${topEmo[1]} 筆` : '—';

  const topBtn = Object.entries(btnCount).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('statTopFunc').textContent = topBtn ? topBtn[0].slice(0,8) : '—';
  document.getElementById('statTopFuncSub').textContent = topBtn ? `${topBtn[1]} 次` : '—';

  // charts
  buildEmotionPie(emoCount);
  buildGenderDoughnut(genderCount);
  buildAgeBar(ageGender);
  buildButtonBar(btnCount);
  buildEmoTable(emoCount);
}

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

const CHART_DEFAULTS = {
  color: '#8B9DC5',
  plugins: { legend: { labels: { color: '#8B9DC5', font: { family: 'Inter', size: 12 } } } }
};

function buildEmotionPie(emoCount) {
  destroyChart('emotions');
  const labels = Object.keys(emoCount).map(e => e || '(未知)');
  const values = Object.values(emoCount);
  const colors = Object.keys(emoCount).map(e => CHART_COLORS.emotions[e] ?? '#6B7280');
  charts.emotions = new Chart(document.getElementById('chartEmotions'), {
    type: 'pie',
    data: { labels, datasets: [{ data: values, backgroundColor: colors, borderColor: '#131929', borderWidth: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'right', labels: { color: '#8B9DC5', padding: 12, font: {size:12} } }, tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed} 筆` } } }
    }
  });
}

function buildGenderDoughnut(genderCount) {
  destroyChart('gender');
  const labels = ['男性 (M)', '女性 (F)', '未辨識'];
  const values = [genderCount.M, genderCount.F, genderCount.Unknown];
  charts.gender = new Chart(document.getElementById('chartGender'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: ['#6382FF','#F472B6','#526080'], borderColor: '#131929', borderWidth: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'right', labels: { color: '#8B9DC5', padding: 12, font:{size:12} } } }
    }
  });
}

function buildAgeBar(ageGender) {
  destroyChart('age');
  const ages = Object.keys(ageGender).sort();
  charts.age = new Chart(document.getElementById('chartAge'), {
    type: 'bar',
    data: {
      labels: ages,
      datasets: [
        { label: '男性', data: ages.map(a => ageGender[a].M), backgroundColor: 'rgba(99,130,255,0.75)', borderRadius: 4 },
        { label: '女性', data: ages.map(a => ageGender[a].F), backgroundColor: 'rgba(244,114,182,0.75)', borderRadius: 4 },
        { label: '未辨識', data: ages.map(a => ageGender[a].Unknown), backgroundColor: 'rgba(82,96,128,0.5)', borderRadius: 4 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#8B9DC5', font:{size:12} } } },
      scales: {
        x: { ticks: { color: '#8B9DC5' }, grid: { color: 'rgba(99,130,255,0.08)' } },
        y: { ticks: { color: '#8B9DC5' }, grid: { color: 'rgba(99,130,255,0.08)' } }
      }
    }
  });
}

function buildButtonBar(btnCount) {
  destroyChart('buttons');
  const sorted = Object.entries(btnCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const labels = sorted.map(([k]) => k);
  const values = sorted.map(([,v]) => v);
  charts.buttons = new Chart(document.getElementById('chartButtons'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: '次數',
        data: values,
        backgroundColor: labels.map((_, i) => `hsla(${200 + i*12},80%,68%,0.8)`),
        borderRadius: 5
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8B9DC5' }, grid: { color: 'rgba(99,130,255,0.08)' } },
        y: { ticks: { color: '#8B9DC5', font:{size:12} }, grid: { display: false } }
      }
    }
  });
}

function buildEmoTable(emoCount) {
  const wrap = document.getElementById('emoTableWrap');
  const sorted = Object.entries(emoCount).sort((a,b)=>b[1]-a[1]);
  const total = sorted.reduce((s,[,v])=>s+v,0);

  const emoClass = e => {
    const v = e.toLowerCase();
    if (v === 'happy') return 'emo-happy';
    if (v === 'neutral') return 'emo-neutral';
    if (v === 'sad') return 'emo-sad';
    if (v === 'angry') return 'emo-angry';
    if (v === 'fear') return 'emo-fear';
    return 'emo-other';
  };

  const rows = sorted.map(([emo, cnt]) => {
    const label = emo || '(未辨識)';
    const pct   = total ? ((cnt / total)*100).toFixed(1) : '0.0';
    return `<tr>
      <td><span class="emo-badge ${emoClass(emo)}">${label}</span></td>
      <td style="font-family:'JetBrains Mono',monospace">${cnt.toLocaleString()}</td>
      <td>${pct}%</td>
      <td>
        <div style="background:rgba(99,130,255,0.1);border-radius:4px;height:6px;overflow:hidden">
          <div style="height:100%;width:${pct}%;border-radius:4px;background:linear-gradient(90deg,#6382FF,#38BEFF)"></div>
        </div>
      </td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `
    <table role="table" aria-label="情緒統計明細">
      <thead>
        <tr>
          <th scope="col">情緒</th>
          <th scope="col">筆數</th>
          <th scope="col">佔比 (%)</th>
          <th scope="col">比例條</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}
</script>
